name: DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Files
        run: ls -la

      - name: Run Basic Tests
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful!""
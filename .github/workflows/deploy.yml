name: DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Files
        run: ls -la

      - name: Run Basic Tests
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-2

      - name: Upload Website Files
        run: |
          aws s3 cp index.html s3://amazegrace-devops-dashboard/
          aws s3 cp styles.css s3://amazegrace-devops-dashboard/
          aws s3 cp script.js s3://amazegrace-devops-dashboard/

      - name: Deployment Complete
        run: echo "Website deployed successfully"

      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful!"